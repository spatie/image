name: run-tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                php: ['8.5', '8.4']
                dependency-version: [prefer-stable]

        name: P${{ matrix.php }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup Node
                uses: actions/setup-node@v7
                with:
                  node-version: '24'

            -   name: Install optimizers
                run: |
                    sudo apt-get update -y
                    sudo apt-get install -y jpegoptim pngquant gifsicle optipng libjpeg-progs webp libavif-bin libheif1 libheif-plugin-aomenc libheif-plugin-libde265 libvips42 libvips-tools
                    sudo npm install -g svgo

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, ffi
                    ini-values: ffi.enable=true, zend.max_allowed_stack_size=-1
                    coverage: pcov

            - name: Setup Problem Matches
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            -   name: Install dependencies
                run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

            -   name: Report avif support
                run: |
                    php -r '
                        echo "gd imageavif(): ", function_exists("imageavif") ? "yes" : "no", PHP_EOL;
                        echo "imagick AVIF formats: ", implode(", ", Imagick::queryFormats("AVIF*")) ?: "none", PHP_EOL;
                    '
                continue-on-error: true

            -   name: Execute tests
                run: |
                   npm install
                   vendor/bin/pest

            -   name: Setup PHP with bundled GD
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: gd-php/php-src@PHP-${{ matrix.php }}
                    coverage: none
                env:
                    GD_PATH: ext/gd
                    GD_CONFIGURE_OPTS: --enable-gd --with-jpeg --with-webp --with-avif --with-freetype --with-xpm
                    GD_LIBS: libpng-dev libjpeg-dev libwebp-dev libavif-dev libfreetype6-dev libxpm-dev

            -   name: Test GD decoder warnings
                run: |
                    php -r 'exit(str_contains(gd_info()["GD Version"], "bundled") ? 0 : 1);'
                    vendor/bin/pest tests/ImageTest.php --filter='libpng|gd failure'
